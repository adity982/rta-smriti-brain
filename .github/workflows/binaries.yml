name: Native binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: rta-smriti-windows-x64
            executable: dist/rta-brain.exe
          - os: macos-latest
            artifact: rta-smriti-macos
            executable: dist/rta-brain
          - os: ubuntu-latest
            artifact: rta-smriti-linux-x64
            executable: dist/rta-brain
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install binary build dependencies
        run: python -m pip install ".[binary]"
      - name: Build executable
        run: python scripts/build_binary.py
      - name: Smoke test executable
        run: python scripts/smoke_binary.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
