name: Native binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: rta-smriti-windows-x64
            executable: dist/rta-brain.exe
          - os: macos-latest
            artifact: rta-smriti-macos
            executable: dist/rta-brain
          - os: ubuntu-latest
            artifact: rta-smriti-linux-x64
            executable: dist/rta-brain
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install binary build dependencies
        run: python -m pip install ".[binary,signing]"
      - name: Build executable
        run: python scripts/build_binary.py
      - name: Smoke test executable
        run: python scripts/smoke_binary.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
