name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:unit
      - run: npm run build
      - run: npm run build:launch
      - name: Install Chromium with Linux runtime dependencies
        if: matrix.python == '3.11' && runner.os == 'Linux'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Install Chromium
        if: matrix.python == '3.11' && runner.os != 'Linux'
        timeout-minutes: 10
        run: npx playwright install chromium
      - run: python -m pip install -e ".[tree-sitter,tokenization,watcher]"
      - run: python scripts/privacy_scan.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q rta_brain tests scripts
      - run: python -m pip install -e . --dry-run --no-deps
      - run: python scripts/build_installed_smoke.py
      - name: Run rendered operator acceptance
        if: matrix.python == '3.11'
        timeout-minutes: 12
        run: npm run test:operator
      - name: Run launch-site operator acceptance
        if: matrix.python == '3.11'
        timeout-minutes: 5
        run: npm run test:launch
      - name: Run packaged public benchmark
        run: python -m rta_brain.cli benchmark --json > public-benchmark-result.json
      - name: Run bounded synthetic performance probe
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        timeout-minutes: 5
        run: python scripts/performance_probe.py --profiles 100 1000 --assert-bounds
      - run: python rta-brain.py publish-readiness --json
      - name: Install standalone binary builder
        if: matrix.python == '3.11'
        run: python -m pip install ".[binary]"
      - name: Build standalone binary
        if: matrix.python == '3.11'
        timeout-minutes: 15
        run: python scripts/build_binary.py
      - name: Smoke-test standalone binary
        if: matrix.python == '3.11'
        timeout-minutes: 5
        run: python scripts/smoke_binary.py
      - name: Stage versioned binary and checksum
        if: matrix.python == '3.11' && matrix.os != 'ubuntu-latest'
        run: python scripts/package_release_artifacts.py
      - name: Stage versioned binary, wheel, and checksums
        if: matrix.python == '3.11' && matrix.os == 'ubuntu-latest'
        run: python scripts/package_release_artifacts.py --include-wheel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          name: public-benchmark-result
          path: public-benchmark-result.json
          if-no-files-found: error
      - name: Upload checksummed release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.11'
        with:
          name: rta-smriti-${{ runner.os }}-${{ runner.arch }}
          path: release-artifacts/
          if-no-files-found: error
