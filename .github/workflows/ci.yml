name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run build:launch
      - run: python scripts/privacy_scan.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q rta_brain tests
      - run: python -m pip install -e . --dry-run --no-deps
      - name: Smoke-test installed wheel
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "rta-smriti-wheel-smoke"
          $wheelDir = Join-Path $smokeRoot "wheel"
          $venv = Join-Path $smokeRoot "venv"
          New-Item -ItemType Directory -Path $wheelDir -Force | Out-Null
          python -m pip wheel --no-deps --wheel-dir $wheelDir .
          python -m venv $venv
          $wheel = Get-ChildItem "$wheelDir\*.whl" | Select-Object -First 1
          & "$venv\Scripts\python.exe" -m pip install --no-deps $wheel.FullName
          & "$venv\Scripts\python.exe" scripts\installed_distribution_smoke.py --cli "$venv\Scripts\rta-brain.exe"
      - run: python rta-brain.py publish-readiness --json
